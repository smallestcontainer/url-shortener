[project]
name = "shortener"
version = "0.0.0"
dependencies = [
    "fastapi[standard]",
    "hashids",
    "pydantic",
    "msgpack>=1.2.1"
]

[project.optional-dependencies]
dev = [ "pytest" ]

[build-system]
requires = ["setuptools >= 84.0.0"]
build-backend = "setuptools.build_meta"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
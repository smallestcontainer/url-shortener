[project]
name = "shortener"
version = "0.0.0"
dependencies = [
    "fastapi[standard]",
    "hashids",
    "pydantic"
]

[project.optional-dependencies]
dev = [ "pytest" ]

[build-system]
requires = ["setuptools >= 70.3.0"]
build-backend = "setuptools.build_meta"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]